[unix_http_server]
file=/run/usf-factory-safe-supervisor.sock
chmod=0700

[supervisord]
nodaemon=false
logfile=/var/log/usf-factory/supervisor.log
logfile_maxbytes=10MB
logfile_backups=5
pidfile=/run/usf-factory-safe-supervisor.pid
childlogdir=/var/log/usf-factory
strip_ansi=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/usf-factory-safe-supervisor.sock

[program:usf-factory-safe]
command=/usr/bin/env -i HOME=/root PATH=/root/usf-factory/.venv/bin:/root/.local/bin:/usr/local/bin:/usr/bin:/bin LC_ALL=C.UTF-8 TZ=UTC USF_FACTORY_ENV_FILE=/root/.config/usf-factory/safe-empty.env USF_FACTORY_SAFE_AUTHORIZATION=/root/.config/usf-factory/safe-adaptive-authorization.json USF_FACTORY_SAFE_WORKFORCE_POLICY=/root/usf-factory/config/safe-adaptive-execution.yaml USF_FACTORY_SAFE_PAUSE_SECONDS=900 /root/usf-factory/scripts/supervise-safe-adaptive.sh
directory=/root/usf-factory
user=root
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=300
startretries=3
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/usf-factory/safe-adaptive.log
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
