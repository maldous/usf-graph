name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Tests (no live services; MCP/providers are mocked)
        run: pytest -q

      - name: Package build
        run: |
          pip install build
          python -m build --wheel

      - name: Secret scan (tracked files must contain no token-shaped strings)
        run: |
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|xai-[A-Za-z0-9]{16,})' \
               -- ':!tests/**' ':!docs/**' ; then
            echo "::error::token-shaped string found in tracked files"; exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env is tracked"; exit 1
          fi
