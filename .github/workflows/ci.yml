name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # 3.11 is the reproducible (lock-pinned) gate; 3.12 is informative (unpinned
    # deps may drift) and does not block the run.
    continue-on-error: ${{ matrix.python-version == '3.12' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (pinned lock on 3.11 for reproducibility)
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pip install -r requirements.lock
            pip install -e . --no-deps
          else
            pip install -e ".[dev]"
          fi

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Tests (no live services; MCP/providers are mocked)
        run: pytest -q

      - name: Package build
        run: |
          pip install build
          python -m build --wheel

      - name: Secret scan (tracked files must contain no token-shaped strings)
        run: |
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|xai-[A-Za-z0-9]{16,})' \
               -- ':!tests/**' ':!docs/**' ; then
            echo "::error::token-shaped string found in tracked files"; exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env is tracked"; exit 1
          fi
